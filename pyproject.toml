[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vikrantsak-inferopt_jd256"
version = "0.1.0"
description = "在同一个输入里两两比对，检测大模型推理优化工程师·冷启动与模型加载时间相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vikrantsak" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vikrantsak.github.io"
Repository = "https://github.com/vikrantsak/inferopt_jd256"
Issues = "https://github.com/vikrantsak/inferopt_jd256/issues"

[project.scripts]
inferopt_jd256 = "inferopt_jd256:main"

[tool.setuptools]
py-modules = ["inferopt_jd256"]
